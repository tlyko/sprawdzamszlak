name: Test

# Unit tests (vitest). No AWS creds, no Terraform — fast and ground-truth.
# Covers apps/api (vitest config in apps/api/vitest.config.ts) and apps/web
# (apps/web/vitest.config.mts). packages/shared schema tests can land in
# either package without further config.

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install workspace deps
        run: corepack pnpm install --frozen-lockfile

      - name: Run apps/api tests
        run: corepack pnpm -F '@sprawdzamszlak/api' test

      - name: Run apps/web tests
        run: corepack pnpm -F sprawdzamszlak-frontend test
