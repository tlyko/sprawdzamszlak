name: Test

# Unit tests (vitest). No AWS creds, no Terraform — fast and ground-truth.
# Currently covers apps/api; packages/shared schema tests can land here later
# without further config (vitest config lives in apps/api/vitest.config.ts).

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/test.yml'
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install workspace deps
        run: corepack pnpm install --frozen-lockfile

      - name: Run apps/api tests
        run: corepack pnpm -F '@sprawdzamszlak/api' test
